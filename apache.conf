# SECURITY: Anti-SSL-Stripping on port 80
# Classic sslstrip intercepts HTTP 301/302 Location headers and rewrites https→http.
# Instead of a redirect header, we serve a static HTML page that redirects via:
#   1. JavaScript: window.location.replace('https://...')
#   2. <meta http-equiv="refresh"> fallback
# sslstrip/mitmproxy do NOT parse or rewrite JS or meta-refresh by default,
# so the victim's browser will upgrade to HTTPS despite the MITM proxy.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public
    ServerSignature Off

    # Serve the JS redirect page for ALL requests on port 80
    RewriteEngine On
    RewriteRule ^ /redirect.html [L]
</VirtualHost>

# HTTPS VirtualHost with TLS
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/server.key

    # SECURITY: TLS 1.3 only — no downgrade to TLS 1.2 or below possible.
    # -all disables every protocol, +TLSv1.3 re-enables only TLS 1.3.
    # Any client that does not support TLS 1.3 will receive a fatal handshake_failure alert.
    SSLProtocol -all +TLSv1.3
    # TLS 1.3 cipher suites — ordered strongest first. TLS 1.3 ignores SSLHonorCipherOrder
    # for its own suites, but listing them explicitly documents accepted algorithms.
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off

    # SECURITY: HSTS header (tells browsers to always use HTTPS)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # SECURITY: Disable HTTP compression to mitigate BREACH attack (CVE-2013-3587).
    # BREACH exploits compressed HTTPS responses containing secrets (e.g., CSRF tokens)
    # to extract them byte-by-byte via chosen-plaintext side-channel.
    SetEnv no-gzip 1
    <IfModule mod_deflate.c>
        SetEnvIfNoCase Request_URI "\.(?:gif|jpe?g|png|webp|ico)$" allow-gzip
        DeflateCompressionLevel 0
    </IfModule>

    # SECURITY: Only serve files from the public directory
    # Config, includes, and templates are NOT accessible from the web
    <Directory /var/www/html/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted

        # Prevent directory listing
        Options -Indexes

        # SECURITY: Disable server signature
        ServerSignature Off

        # SECURITY: Only allow GET, POST, HEAD — reject all other HTTP methods
        <LimitExcept GET POST HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    # SECURITY: Block access to sensitive directories
    <Directory /var/www/html/config>
        Require all denied
    </Directory>

    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    <Directory /var/www/html/templates>
        Require all denied
    </Directory>

    # SECURITY: Prevent PHP execution in uploads directory
    <Directory /var/www/html/public/uploads>
        # Deny execution of PHP files in uploads
        <FilesMatch "\.ph(p[3457]?|t|tml)$">
            Require all denied
        </FilesMatch>

        # Force all files to be served as their actual MIME type
        # Prevents browsers from executing uploaded files
        <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set Content-Disposition "inline"
        </IfModule>

        # Only allow image files
        <FilesMatch "\.(?i)(jpe?g|png|gif|webp)$">
            Require all granted
        </FilesMatch>
    </Directory>

    # SECURITY: Block access to hidden files (e.g., .env)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # SECURITY: Block access to .git directory and all contents
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    # SECURITY: Block access to SQL files
    <FilesMatch "\.sql$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# SECURITY: Disable server tokens (hide Apache version)
ServerTokens Prod
ServerSignature Off

# SECURITY: Remove X-Powered-By header (defense-in-depth, complements expose_php=Off)
Header always unset X-Powered-By
