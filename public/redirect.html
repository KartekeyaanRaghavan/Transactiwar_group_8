<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=https://10.96.0.74/">
    <title>Redirecting...</title>
    <script>
    // SECURITY: JS-based redirect — sslstrip cannot intercept this
    // (sslstrip only rewrites HTTP Location headers, not JavaScript)
    if (window.location.protocol !== 'https:') {
        window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search);
    }
    </script>
</head>
<body>
    <noscript>
        <p>Please visit: <a href="https://10.96.0.74/">https://10.96.0.74/</a></p>
    </noscript>
</body>
